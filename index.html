<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반민특위 재판정</title>
<meta name="description" content="1949년 특별검찰관이 되어 박흥식 사건을 조사하는 한국사 역사 추리 게임">
<meta name="theme-color" content="#1d2a40">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://thumb.wikimedia.org">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header class="hud" id="hud" hidden>
  <button class="hud-back" id="hudBack" aria-label="사건 대시보드로">←</button>
  <div class="hud-title" id="hudTitle"></div>
  <div class="hud-right">
    <div class="hud-chances" id="hudChances" title="보완 조사 기회"></div>
    <button class="hud-locker" id="hudLocker" aria-label="증거 보관함">
      <span class="brief" aria-hidden="true"></span><span>증거 보관함</span><b id="hudCount">0/6</b>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot" id="foot">
  <button class="linkbtn" id="btnSources">자료·이미지 출처</button>
  <span aria-hidden="true">·</span>
  <button class="linkbtn" id="btnReset">처음부터 다시</button>
  <span class="credit">제작: 이태형T(한백고)</span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-x" id="modalX" aria-label="닫기">×</button>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<script src="data.js?v=8"></script>
<script src="story.js?v=8"></script>
<script src="images.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
